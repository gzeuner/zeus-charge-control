<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:lang="${lang}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{title}">ChargeControl V3.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        (function () {
            const key = 'chargeControlTheme';
            const allowedThemes = ['default', 'dark', 'energy', 'solar', 'ember'];
            let theme = 'default';
            try {
                const stored = localStorage.getItem(key);
                if (allowedThemes.includes(stored)) theme = stored;
            } catch (error) {
                theme = 'default';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/darkmode.css}">

    <script th:src="@{/js/jquery.slim.min.js}"></script>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/chart.min.js}"></script>
    <script th:src="@{/js/luxon.min.js}"></script>
    <script th:src="@{/js/chartjs-adapter-luxon.umd.js}"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        window.AppData = {
          translations: {
            idle: /*[[#{idle}]]*/ 'Idle',
            automatic: /*[[#{automatic}]]*/ 'Automatic',
            nightIdle: /*[[#{nightIdle}]]*/ 'Night Idle',
            nightWindowKicker: /*[[#{nightWindowKicker}]]*/ 'Night idle window',
            nightWindowTitle: /*[[#{nightWindowTitle}]]*/ 'Set quiet hours',
            nightWindowStartLabel: /*[[#{nightWindowStartLabel}]]*/ 'Start',
            nightWindowEndLabel: /*[[#{nightWindowEndLabel}]]*/ 'End',
            nightWindowSave: /*[[#{nightWindowSave}]]*/ 'Save',
            nightWindowStatusDefault: /*[[#{nightWindowStatusDefault}]]*/ 'Default values apply until saved.',
            nightWindowStatusSaved: /*[[#{nightWindowStatusSaved}]]*/ 'Saved',
            nightWindowInvalidHours: /*[[#{nightWindowInvalidHours}]]*/ 'Please enter hours between 0 and 23.',
            nightWindowSaveError: /*[[#{nightWindowSaveError}]]*/ 'Saving night window failed',
            on: /*[[#{on}]]*/ 'On',
            off: /*[[#{off}]]*/ 'Off',
            charging: /*[[#{charging}]]*/ 'Charging',
            stopped: /*[[#{stopped}]]*/ 'Stopped',
            chargingButtonTooltip: /*[[#{chargingButtonTooltip}]]*/ 'Starts or stops charging from the grid.',
            currentPriceLabel: /*[[#{currentPriceLabel}]]*/ 'Current Price',
            dropRateLabel: /*[[#{dropRateLabel}]]*/ 'Drop Rate',
            estimatedTimeToTargetLabel: /*[[#{estimatedTimeToTargetLabel}]]*/ 'Estimated Time to Target',
            noCurrentPriceInfo: /*[[#{noCurrentPriceInfo}]]*/ 'No current price available',
            chart: /*[[#{chart}]]*/ 'Chart',
            table: /*[[#{table}]]*/ 'Table',
            startTime: /*[[#{startTime}]]*/ 'Start Time',
            price: /*[[#{price}]]*/ 'Price',
            priceModeNettoLabel: /*[[#{priceModeNettoLabel}]]*/ 'Market',
            priceModeBruttoLabel: /*[[#{priceModeBruttoLabel}]]*/ 'Total',
            centPerKwh: /*[[#{centPerKwh}]]*/ 'cent/kWh'
          },
          cheapestPeriods: JSON.parse(/*[[${cheapestPeriodsJson}]]*/ "[]"),
          marketPrices: JSON.parse(/*[[${marketPricesJson}]]*/ "[]"),
          scheduledChargingPeriods: JSON.parse(/*[[${scheduledChargingPeriodsJson}]]*/ "[]"),
          nightChargingIdle: /*[[${nightChargingIdle}]]*/ false,
          nightIdleActive: /*[[${nightIdleActive}]]*/ false,
          nightStartHour: /*[[${nightStartHour}]]*/ 22,
          nightEndHour: /*[[${nightEndHour}]]*/ 6,
          currentTime: /*[[${currentTime}]]*/ 0
        };
        /*]]>*/
    </script>

    <script th:src="@{/js/main.js}" defer></script>
    <script>
        function toggleLanguage(lang) {
          window.location.href = '/charging-status?lang=' + lang;
        }
    </script>
</head>

<body class="status-page">
<div class="app-shell"
     th:with="chargingText=#{charging}, dischargingText=#{discharging}, idleText=#{idle}, manualText=#{manual}, automaticText=#{automatic}">
    <header th:replace="~{fragments/charging-status :: topbar}"></header>

    <main class="app-main">
        <section th:replace="~{fragments/charging-status :: hero}"></section>

        <section class="panel error-panel" th:if="${batteryNotConfigured}" aria-labelledby="batteryConfigErrorTitle">
            <div class="panel-header">
                <div>
                    <p class="eyebrow" th:text="#{summarySectionKicker}">System overview</p>
                    <h2 class="panel-title" id="batteryConfigErrorTitle" th:text="#{batteryNotConfiguredTitle}">Battery Configuration Error</h2>
                </div>
            </div>
            <p class="error-text" th:text="#{batteryNotConfiguredMessage}">The battery is not configured properly.</p>
        </section>

        <div class="app-grid" th:unless="${batteryNotConfigured}">
            <section th:replace="~{fragments/charging-status :: batterySummary}"></section>
            <aside th:replace="~{fragments/charging-status :: controlSidebar}"></aside>
        </div>

        <section th:replace="~{fragments/charging-status :: dataSection}"></section>
    </main>

    <div th:replace="~{fragments/charging-status :: confirmationModal}"></div>
    <div th:replace="~{fragments/charging-status :: loaderOverlay}"></div>
</div>
</body>
</html>
