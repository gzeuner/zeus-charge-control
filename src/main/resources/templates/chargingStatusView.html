<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org" th:lang="${lang}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Zeus Charge Control — energy, battery and intelligent charging at a glance."
    />
    <title>Zeus Charge Control · 4.0</title>
    <script>
      try {
        const theme = localStorage.getItem("chargeControlTheme");
        document.documentElement.dataset.theme = [
          "default",
          "dark",
          "energy",
          "solar",
          "ember",
        ].includes(theme)
          ? theme
          : "default";
      } catch (_) {
        document.documentElement.dataset.theme = "default";
      }
    </script>
    <link rel="icon" th:href="@{/favicon.ico}" />
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/all.min.css}" />
    <link rel="stylesheet" th:href="@{/css/darkmode.css}" />
    <script th:src="@{/js/bootstrap.bundle.min.js}" defer></script>
    <script th:src="@{/js/chart.min.js}" defer></script>
    <script th:src="@{/js/luxon.min.js}" defer></script>
    <script th:src="@{/js/chartjs-adapter-luxon.umd.js}" defer></script>
    <script th:inline="javascript">
      window.AppData = {
        translations: {
          automatic: /*[[#{ui.automatic}]]*/ "Automatic",
          idle: /*[[#{ui.paused}]]*/ "Paused",
          charging: /*[[#{ui.charging}]]*/ "Charging",
          discharging: /*[[#{ui.discharging}]]*/ "Discharging",
          standby: /*[[#{ui.standby}]]*/ "Standby",
          pause: /*[[#{ui.pauseAction}]]*/ "Pause battery",
          resume: /*[[#{ui.resumeAction}]]*/ "Resume automatic control",
          startCharging: /*[[#{ui.startAction}]]*/ "Start grid charging",
          stopCharging: /*[[#{ui.stopAction}]]*/ "Stop grid charging",
          chart: /*[[#{chart}]]*/ "Chart",
          table: /*[[#{table}]]*/ "Table",
          price: /*[[#{price}]]*/ "Price",
          startTime: /*[[#{startTime}]]*/ "Start",
          marketBasis: /*[[#{ui.marketBasis}]]*/ "Market · net",
          totalBasis: /*[[#{ui.totalBasis}]]*/ "Total · incl. VAT",
          unit: /*[[#{centPerKwh}]]*/ "ct/kWh",
          empty: /*[[#{ui.empty}]]*/ "No data available yet.",
          emptyPlan:
            /*[[#{ui.emptyPlan}]]*/ "No charging windows planned. The schedule updates automatically when charging is needed.",
          noOpportunity:
            /*[[#{ui.noOpportunity}]]*/ "No upcoming prices available.",
          unknown: /*[[#{ui.unknown}]]*/ "Unavailable",
          connected: /*[[#{ui.connected}]]*/ "Up to date",
          stale:
            /*[[#{ui.stale}]]*/ "Connection interrupted · values may be outdated",
          batteryUnavailable:
            /*[[#{ui.batteryUnavailable}]]*/ "Battery unavailable",
          actionSuccess: /*[[#{ui.actionSuccess}]]*/ "Setting applied.",
          actionFailed:
            /*[[#{ui.actionFailed}]]*/ "The action could not be completed. Check the battery connection and charging target, then try again.",
          saved: /*[[#{ui.saved}]]*/ "Quiet hours saved for this session.",
          invalidHours:
            /*[[#{ui.invalidHours}]]*/ "Enter distinct whole hours between 0 and 23.",
          unsaved: /*[[#{ui.unsaved}]]*/ "Unsaved changes",
          nightEnabled: /*[[#{ui.nightEnabled}]]*/ "Enabled",
          nightDisabled: /*[[#{ui.nightDisabled}]]*/ "Disabled",
          nightActive: /*[[#{ui.nightActive}]]*/ "Active now",
          now: /*[[#{ui.now}]]*/ "Now",
          lastUpdated: /*[[#{ui.lastUpdated}]]*/ "Updated",
          configured:
            /*[[#{batteryNotConfiguredMessage}]]*/ "Configure the battery connection.",
        },
        marketPrices: JSON.parse(/*[[${marketPricesJson}]]*/ "[]"),
        cheapestPeriods: JSON.parse(/*[[${cheapestPeriodsJson}]]*/ "[]"),
        scheduledChargingPeriods: JSON.parse(
          /*[[${scheduledChargingPeriodsJson}]]*/ "[]",
        ),
        nightStartHour: /*[[${nightStartHour}]]*/ 19,
        nightEndHour: /*[[${nightEndHour}]]*/ 6,
      };
    </script>
    <script th:src="@{/js/main.js}" defer></script>
  </head>
  <body class="status-page">
    <a class="skip-link" href="#main" th:text="#{ui.skip}">Skip to content</a>
    <nav class="app-rail" th:attr="aria-label=#{ui.navigation}">
      <a class="rail-logo" href="#main" aria-label="Zeus"
        ><i class="fas fa-bolt" aria-hidden="true"></i
      ></a>
      <a
        class="rail-link active"
        href="#main"
        th:attr="aria-label=#{ui.overview}"
        ><i class="fas fa-house" aria-hidden="true"></i
      ></a>
      <a
        class="rail-link"
        href="#dataSectionTitle"
        th:attr="aria-label=#{ui.prices}"
        ><i class="fas fa-chart-simple" aria-hidden="true"></i
      ></a>
      <a
        class="rail-link"
        href="#controlPanelTitle"
        th:attr="aria-label=#{ui.controls}"
        ><i class="fas fa-sliders" aria-hidden="true"></i
      ></a>
      <span class="rail-bottom">Z<span>4.0</span></span>
    </nav>
    <div class="app-shell">
      <header th:replace="~{fragments/charging-status :: topbar}"></header>
      <main class="app-main" id="main" tabindex="-1">
        <div
          class="sample-banner"
          th:if="${sampleData == true}"
          th:text="#{ui.sampleData}"
        >
          Demo · Sample data · No battery connected
        </div>
        <noscript
          ><p class="notice notice-error" th:text="#{ui.javascript}">
            Enable JavaScript to use live status and battery controls.
          </p></noscript
        >
        <section th:replace="~{fragments/charging-status :: hero}"></section>
        <div
          id="actionNotice"
          class="notice"
          role="status"
          aria-live="polite"
          hidden
        ></div>
        <div
          id="connectionNotice"
          class="notice notice-error"
          role="status"
          hidden
        >
          <span th:text="#{ui.stale}"
            >Connection interrupted · values may be outdated</span
          >
          <button
            class="text-button"
            id="retryStatus"
            type="button"
            th:text="#{ui.retry}"
          >
            Try again
          </button>
        </div>
        <section
          class="notice notice-error"
          id="batteryWarning"
          th:hidden="${batteryAvailable}"
          aria-labelledby="batteryWarningTitle"
        >
          <strong id="batteryWarningTitle" th:text="#{ui.batteryUnavailable}"
            >Battery unavailable</strong
          >
          <span
            id="batteryWarningText"
            th:text="${batteryNotConfigured} ? #{batteryNotConfiguredMessage} : #{ui.batteryConnectionHelp}"
          ></span>
        </section>
        <div class="app-grid">
          <section
            th:replace="~{fragments/charging-status :: batterySummary}"
          ></section>
          <aside
            th:replace="~{fragments/charging-status :: controlSidebar}"
          ></aside>
        </div>
        <section
          th:replace="~{fragments/charging-status :: dataSection}"
        ></section>
      </main>
      <footer class="app-footer">
        <span>ZEUS CHARGE CONTROL <b>4.0.0</b></span
        ><span th:text="#{ui.footer}"
          >Intelligent energy. Simply in control.</span
        ><a th:href="@{/license(lang=${lang})}" th:text="#{licenseTerms}"
          >License</a
        >
      </footer>
    </div>
    <div th:replace="~{fragments/charging-status :: confirmationModal}"></div>
  </body>
</html>
