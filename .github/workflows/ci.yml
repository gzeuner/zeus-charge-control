name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Verify
        run: mvn -B clean verify

      - name: Set up Node for isolated browser tests
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned browser tools
        run: npm ci --ignore-scripts --no-fund

      - name: Check formatting and reproducible browser assets
        run: |
          npm run format:check
          npm run vendor
          git diff --exit-code -- src/main/resources/static

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify desktop and mobile UI
        run: npm run test:ui

      - name: Keep UI reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ui-verification
          path: |
            playwright-report/
            test-results/
            images/screenshots/
